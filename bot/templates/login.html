<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Telegram VIP Bot</title>
    <link rel="stylesheet" href="/static/css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="glass-panel login-card">
            <div class="login-header">
                <div class="brand" style="justify-content: center; margin-bottom: 1rem;">
                    <div class="brand-icon"><i class="fa-solid fa-robot"></i></div>
                    <span>VIP Bot Admin</span>
                </div>
                <p>Enter secret password to access domain dashboard</p>
            </div>

            {% if error %}
            <div class="alert alert-error">
                <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
            </div>
            {% endif %}

            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-key"></i> Admin Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter admin password..." required autofocus>
                </div>
                <button type="submit" class="btn-primary">
                    <i class="fa-solid fa-right-to-bracket"></i> Login to Dashboard
                </button>
            </form>
        </div>
    </div>
</body>
</html>
